function compressImage(file) {
  return new Promise(function (resolve) {
    if (!file || !/^image\//.test(file.type)) { resolve({ blob: file, contentType: file ? file.type : "application/octet-stream", ext: (file && file.name && file.name.split(".").pop()) || "bin" }); return; }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1600, w = img.width, hh = img.height;
      if (w > max || hh > max) { var r = Math.min(max / w, max / hh); w = Math.round(w * r); hh = Math.round(hh * r); }
      var cv = document.createElement("canvas"); cv.width = w; cv.height = hh;
      cv.getContext("2d").drawImage(img, 0, 0, w, hh);
      cv.toBlob(function (b) { URL.revokeObjectURL(url); resolve({ blob: b || file, contentType: "image/jpeg", ext: "jpg" }); }, "image/jpeg", 0.7);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve({ blob: file, contentType: file.type || "image/jpeg", ext: "jpg" }); };
    img.src = url;
  });
}

// Faixas de comissão por TOTAL no período.
function commissionRate(total) {
  if (total >= 100000) return 0.03;
  if (total >= 50000) return 0.025;
  return 0.02;
}
function rateLabel(total) {
  return `${(commissionRate(total) * 100).toString().replace(".", ",")}%`;
}

// Janela quinzenal de fechamento: 26→10 e 11→25.
function payWindow(ref = new Date()) {
  const d = ref.getDate();
  if (d >= 26 || d <= 10) return "26→10 (quinzena A)";
  return "11→25 (quinzena B)";
}

// Calcula a comissão de UMA venda conforme a regra do consultor.
// Suporta: percentual, valor fixo, ou faixa (sobre o acumulado do período).
function calcCommissionForSale(rule, saleValue, accumulatedBefore = 0) {
  if (!rule) return {
    ok: false,
    reason: "SEM_REGRA",
    amount: 0
  };
  if (rule.type === "percentual") return {
    ok: true,
    amount: saleValue * (rule.percent ?? 0) / 100
  };
  if (rule.type === "fixo") return {
    ok: true,
    amount: rule.fixed ?? 0
  };
  if (rule.type === "faixa") {
    // Faixa pelo total acumulado após esta venda (consistente com a tela Comissão).
    const totalAfter = accumulatedBefore + saleValue;
    const amount = saleValue * commissionRate(totalAfter);
    return {
      ok: true,
      amount
    };
  }
  return {
    ok: false,
    reason: "SEM_REGRA",
    amount: 0
  };
}

function useIsMobile() {
  const [m, setM] = useState(typeof window !== "undefined" ? window.innerWidth < 820 : false);
  useEffect(() => {
    const f = () => setM(window.innerWidth < 820);
    window.addEventListener("resize", f);
    return () => window.removeEventListener("resize", f);
  }, []);
  return m;
}
